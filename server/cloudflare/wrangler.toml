name = "khold-levels"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Replace database_id with the value printed by:
#   npx wrangler d1 create khold-levels
[[d1_databases]]
binding = "DB"
database_name = "khold-levels"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[observability]
enabled = true
