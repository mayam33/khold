name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "server/cloudflare/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare
    # Set the repository variable CLOUDFLARE_DEPLOY=true after adding the
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
    if: ${{ vars.CLOUDFLARE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply khold-levels --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
