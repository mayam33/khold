name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable
  APK_NAME: khold.apk

jobs:
  apk:
    name: Export signed debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-export-templates-4.7.2-stable-v1

      - name: Download Godot export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/godot-templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          cp -r /tmp/godot-templates/templates/. ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Install Godot 4.7.2
        run: |
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          sudo mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/${{ env.APK_NAME }}
          ls -lh build/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khold-apk
          path: build/*.apk
          if-no-files-found: error
          retention-days: 30
