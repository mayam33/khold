name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  APK_NAME: BeaverExplorer.apk
  # ubuntu-latest ships the Android SDK here. Godot reads these variables on
  # its first editor launch to auto-configure export/android/*_sdk_path.
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  apk:
    name: Export signed debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-export-templates-4.7.2-stable-v1

      - name: Download Godot export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/godot-templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          cp -r /tmp/godot-templates/templates/. ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Install Godot 4.7.2
        run: |
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          sudo mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "platforms;android-36" \
            "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Import project and initialize editor settings
        run: godot --headless --path . --editor --quit

      - name: Verify toolchain
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          keytool -help > /dev/null 2>&1 && echo "keytool OK"
          ls "$ANDROID_HOME/build-tools"

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/${{ env.APK_NAME }}
          ls -lh build/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beaver-explorer-apk
          path: build/*.apk
          if-no-files-found: error
          retention-days: 30
